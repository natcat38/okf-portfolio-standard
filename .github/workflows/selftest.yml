name: selftest
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # tests/run.mjs runs all four fixtures with their expected outcomes and
      # checks each bad fixture names every error it should. `npm run selftest`
      # calls the same file, so local and CI self-tests cannot drift.
      - name: Self-test every fixture
        run: node tests/run.mjs
