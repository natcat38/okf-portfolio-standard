name: selftest
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Good fixture must pass
        run: node bin/okf-validate.mjs tests/fixtures/good
      - name: Bad fixture must fail
        run: |
          if node bin/okf-validate.mjs tests/fixtures/bad; then
            echo "::error::bad fixture unexpectedly passed"
            exit 1
          fi
          echo "bad fixture failed as expected"
